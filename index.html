<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OrderFlow — Order Blocks, Liquidity & News Impact</title>
    <meta
      name="description"
      content="Live order block, liquidity, market-breadth and news-impact terminal for crypto and Indian markets."
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('of-theme');
          if (t === 'light') document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!--
        Boot placeholder. React replaces this the moment the entry module runs,
        so the first paint is never an empty page. If the app still has not
        mounted when the timer below fires, the module graph failed to load and
        the placeholder explains what to do instead of leaving a blank screen.
      -->
      <div
        id="of-boot"
        style="
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 10px;
          padding: 24px;
          text-align: center;
          font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
          font-size: 13px;
          color: #6b7280;
          background: #f6f7f9;
        "
      >
        <div
          style="
            width: 22px;
            height: 22px;
            border: 2px solid #d7dbe2;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: of-boot-spin 0.8s linear infinite;
          "
        ></div>
        <div>Loading OrderFlow…</div>
      </div>
    </div>
    <style>
      @keyframes of-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      // Safety net. `main.tsx` sets window.__ofBooted the moment it executes.
      // If that has not happened after this delay, either the dev server is
      // still compiling or a module failed to load — say so rather than show a
      // blank page and leave the cause to guesswork.
      window.setTimeout(function () {
        var boot = document.getElementById('of-boot');
        if (!boot || window.__ofBooted) return; // React mounted and replaced it.
        boot.innerHTML =
          '<div style="font-weight:700;color:#dc2626;font-size:14px">OrderFlow did not finish starting.</div>' +
          '<div style="max-width:520px;line-height:1.5">' +
          'The dev server is still compiling, or a module failed to load. ' +
          'Check the terminal running <code>npm run dev</code> and the browser console, then reload this page.' +
          '</div>';
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
